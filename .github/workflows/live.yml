name: Live canary

# Runs the real unpacked extension against youtube.com to catch YouTube DOM changes that the
# fixture suite cannot see. Skips (not fails) when YouTube itself does not deliver transcripts.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-canary
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-canary-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Separate job: only this one may write issues, and it runs no repository code.
  report:
    needs: live
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-canary --color B60205 --description "Nightly live check against youtube.com failed" 2>/dev/null || true
          existing=$(gh issue list --label live-canary --state open --json number --jq '.[0].number')
          body="The nightly live canary failed: $RUN_URL. YouTube may have changed its transcript panel; see the report artifact."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live canary failed: YouTube transcript scraping" --label live-canary --body "$body"
          fi
