<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTTS – Einstellungen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img src="icons/icon48.png" width="40" height="40" alt="">
    <div>
      <h1>YTTS</h1>
      <p>YouTube-Transkripte kopieren</p>
    </div>
  </header>
  <main aria-label="Einstellungen">
    <div class="row view-row">
      <span>
        <span class="setting-title" id="view-label">Ansicht</span>
        <span class="setting-hint" id="view-hint">Zeilen wie YouTube, ganze Sätze oder Fließtext</span>
      </span>
      <div class="chips" role="radiogroup" aria-labelledby="view-label" aria-describedby="view-hint">
        <label class="chip"><input type="radio" name="view" value="lines" disabled>Zeilen</label>
        <label class="chip"><input type="radio" name="view" value="sentences" disabled>Sätze</label>
        <label class="chip"><input type="radio" name="view" value="text" disabled>Text</label>
      </div>
    </div>
    <label class="row">
      <span>
        <span class="setting-title">Transkript ausgeklappt anzeigen</span>
        <span class="setting-hint" id="expanded-hint">Direkt beim Öffnen eines Videos</span>
      </span>
      <input type="checkbox" role="switch" class="toggle" data-key="expandedByDefault" aria-describedby="expanded-hint" disabled>
    </label>
    <label class="row">
      <span>
        <span class="setting-title">Zeitstempel beim Kopieren</span>
        <span class="setting-hint" id="timestamps-hint">Zeitangaben im kopierten Text</span>
      </span>
      <input type="checkbox" role="switch" class="toggle" data-key="copyTimestamps" aria-describedby="timestamps-hint" disabled>
    </label>
  </main>
  <footer id="save-status" role="status">Einstellungen werden automatisch gespeichert.</footer>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
